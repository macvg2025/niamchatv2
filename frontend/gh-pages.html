<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiamChat</title>
    <style>
       /* ===== RESET & BASE STYLES ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    min-height: 100vh;
    background: #0f172a;
    color: #f8fafc;
    overflow-x: hidden;
}

#root {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* ===== LANDING PAGE ===== */
.landing-container {
    background: rgba(30, 41, 59, 0.9);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 50px 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    text-align: center;
    max-width: 500px;
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.1);
    animation: fadeInUp 0.6s ease-out;
}

.landing-title {
    font-size: 3.2rem;
    background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    font-weight: 800;
}

.landing-subtitle {
    color: #94a3b8;
    margin-bottom: 40px;
    font-size: 1.2rem;
}

.username-input {
    width: 100%;
    padding: 18px 20px;
    font-size: 1.2rem;
    background: rgba(15, 23, 42, 0.7);
    border: 2px solid #334155;
    border-radius: 12px;
    margin-bottom: 25px;
    color: #f8fafc;
    transition: all 0.3s ease;
}

.username-input:focus {
    outline: none;
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
}

.enter-button {
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    color: white;
    border: none;
    padding: 18px 50px;
    font-size: 1.3rem;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
    position: relative;
    overflow: hidden;
}

.enter-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
}

.enter-button:active {
    transform: translateY(0);
}

.enter-button::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        to right,
        transparent 20%,
        rgba(255, 255, 255, 0.3) 50%,
        transparent 80%
    );
    transform: rotate(30deg);
    transition: transform 0.6s;
}

.enter-button:hover::after {
    transform: rotate(30deg) translateX(100%);
}

/* ===== MAIN HUB ===== */
.main-hub {
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(15px);
    border-radius: 28px;
    padding: 50px 40px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    max-width: 900px;
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    animation: fadeInUp 0.6s ease-out;
}

.hub-title {
    font-size: 2.8rem;
    background: linear-gradient(135deg, #34d399 0%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 15px;
    text-align: center;
    font-weight: 800;
}

.hub-subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 50px;
    font-size: 1.3rem;
}

.hub-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-bottom: 50px;
}

@media (max-width: 768px) {
    .hub-buttons {
        grid-template-columns: 1fr;
        gap: 25px;
    }
}

.hub-button {
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    color: white;
    border: none;
    padding: 70px 30px;
    font-size: 1.8rem;
    font-weight: 700;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    position: relative;
    overflow: hidden;
    border: 2px solid transparent;
}

.hub-button:hover {
    transform: scale(1.05);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    border-color: rgba(96, 165, 250, 0.3);
}

.hub-button:active {
    transform: scale(1.02);
}

.hub-button.public {
    background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
}

.hub-button.private {
    background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
}

.button-icon {
    font-size: 4rem;
    margin-bottom: 10px;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
}

.button-description {
    font-size: 1.1rem;
    opacity: 0.9;
    font-weight: 400;
    margin-top: 10px;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes pulse {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.05);
    }
    100% {
        transform: scale(1);
    }
}

@keyframes slideInRight {
    from {
        opacity: 0;
        transform: translateX(30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.fade-in {
    animation: fadeIn 0.5s ease-out;
}

.fade-in-up {
    animation: fadeInUp 0.6s ease-out;
}

.slide-in-right {
    animation: slideInRight 0.4s ease-out;
}

.pulse {
    animation: pulse 0.5s ease-in-out;
}

/* ===== LOADING STATES ===== */
.loading {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 200px;
}

.loading-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(96, 165, 250, 0.3);
    border-radius: 50%;
    border-top-color: #60a5fa;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ===== UTILITY CLASSES ===== */
.hidden {
    display: none !important;
}

.text-center {
    text-align: center;
}

.mt-1 { margin-top: 10px; }
.mt-2 { margin-top: 20px; }
.mt-3 { margin-top: 30px; }
.mb-1 { margin-bottom: 10px; }
.mb-2 { margin-bottom: 20px; }
.mb-3 { margin-bottom: 30px; }

.error-message {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid #ef4444;
    color: #fca5a5;
    padding: 12px 20px;
    border-radius: 10px;
    margin: 20px 0;
    animation: fadeIn 0.3s ease-out;
}

.success-message {
    background: rgba(34, 197, 94, 0.2);
    border: 1px solid #22c55e;
    color: #86efac;
    padding: 12px 20px;
    border-radius: 10px;
    margin: 20px 0;
    animation: fadeIn 0.3s ease-out;
}

/* ===== SCROLLBAR STYLING ===== */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: rgba(30, 41, 59, 0.5);
    border-radius: 5px;
}

::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
    border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
}

/* ===== CHAT ROOM LAYOUT ===== */
.chat-container {
    display: flex;
    height: 90vh;
    min-height: 600px;
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(15px);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.15);
    animation: fadeInUp 0.6s ease-out;
    width: 100%;
    max-width: 1400px;
}

/* ===== SIDEBAR ===== */
.sidebar {
    width: 280px;
    background: rgba(15, 23, 42, 0.8);
    padding: 25px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
}

.user-info {
    padding: 20px;
    background: rgba(30, 41, 59, 0.7);
    border-radius: 15px;
    margin-bottom: 25px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.user-avatar {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    border-radius: 50%;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: bold;
    color: white;
}

.username-display {
    font-size: 1.2rem;
    font-weight: 600;
    color: #f8fafc;
    margin-bottom: 5px;
}

.user-status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #10b981;
    font-size: 0.9rem;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

.room-switcher {
    margin-bottom: 25px;
}

.switcher-title {
    font-size: 1rem;
    color: #94a3b8;
    margin-bottom: 12px;
    font-weight: 600;
}

.switch-button {
    width: 100%;
    padding: 14px;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #f8fafc;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 10px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
}

.switch-button:hover {
    background: rgba(59, 130, 246, 0.2);
    border-color: rgba(96, 165, 250, 0.3);
    transform: translateX(5px);
}

.switch-button.active {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.3) 0%, rgba(139, 92, 246, 0.3) 100%);
    border-color: rgba(96, 165, 250, 0.5);
}

.online-users {
    flex: 1;
    overflow-y: auto;
}

.online-title {
    font-size: 1rem;
    color: #94a3b8;
    margin-bottom: 15px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.user-count {
    background: rgba(96, 165, 250, 0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.9rem;
    color: #60a5fa;
}

.user-list {
    list-style: none;
}

.user-item {
    padding: 12px 15px;
    margin-bottom: 8px;
    background: rgba(30, 41, 59, 0.5);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s ease;
    border: 1px solid transparent;
}

.user-item:hover {
    background: rgba(30, 41, 59, 0.8);
    border-color: rgba(255, 255, 255, 0.1);
}

.user-avatar-small {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.9rem;
    color: white;
}

.user-details {
    flex: 1;
}

.user-name {
    font-weight: 600;
    color: #f8fafc;
    font-size: 0.95rem;
}

.user-status-small {
    font-size: 0.8rem;
    color: #94a3b8;
}

/* ===== MAIN CHAT AREA ===== */
.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(15, 23, 42, 0.5);
}

.chat-header {
    padding: 25px 30px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(30, 41, 59, 0.8);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.room-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.room-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
}

.room-details h2 {
    font-size: 1.5rem;
    color: #f8fafc;
    margin-bottom: 4px;
}

.room-stats {
    display: flex;
    gap: 15px;
    font-size: 0.9rem;
    color: #94a3b8;
}

.room-code {
    background: rgba(96, 165, 250, 0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-family: monospace;
    font-weight: 600;
    letter-spacing: 1px;
}

.chat-actions {
    display: flex;
    gap: 12px;
}

.action-button {
    padding: 10px 20px;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #f8fafc;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

.action-button:hover {
    background: rgba(59, 130, 246, 0.2);
    border-color: rgba(96, 165, 250, 0.3);
}

/* ===== MESSAGES CONTAINER ===== */
.messages-container {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.message {
    padding: 20px;
    border-radius: 18px;
    max-width: 70%;
    position: relative;
    animation: slideInRight 0.3s ease-out;
}

.message.sent {
    align-self: flex-end;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    border-bottom-right-radius: 5px;
}

.message.received {
    align-self: flex-start;
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom-left-radius: 5px;
}

.message.admin {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    border: 2px solid rgba(245, 158, 11, 0.5);
    box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
}

.message.creator {
    background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
    border: 2px solid rgba(148, 163, 184, 0.5);
    box-shadow: 0 0 20px rgba(148, 163, 184, 0.2);
}

.message-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.message-sender {
    display: flex;
    align-items: center;
    gap: 10px;
}

.sender-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 600;
    color: white;
}

.sender-name {
    font-weight: 700;
    font-size: 1rem;
    color: #f8fafc;
}

.sender-badge {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
}

.sender-badge.admin {
    background: rgba(245, 158, 11, 0.3);
    color: #fcd34d;
}

.sender-badge.creator {
    background: rgba(148, 163, 184, 0.3);
    color: #cbd5e1;
}

.message-time {
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.7);
}

.message-content {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #f8fafc;
    margin-bottom: 15px;
    word-break: break-word;
}

.message-image {
    max-width: 100%;
    border-radius: 12px;
    margin: 10px 0;
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: transform 0.3s ease;
}

.message-image:hover {
    transform: scale(1.02);
}

/* ===== MESSAGE ACTIONS ===== */
.message-actions {
    display: flex;
    gap: 15px;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.action-button-small {
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    transition: all 0.2s ease;
}

.action-button-small:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #f8fafc;
}

.action-button-small.liked {
    color: #3b82f6;
}

.action-button-small.disliked {
    color: #ef4444;
}

.action-count {
    font-size: 0.85rem;
    font-weight: 600;
}

/* ===== MESSAGE INPUT ===== */
.message-input-area {
    padding: 25px 30px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(30, 41, 59, 0.8);
    display: flex;
    gap: 15px;
    align-items: flex-end;
}

.input-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.message-input {
    width: 100%;
    padding: 18px 20px;
    background: rgba(15, 23, 42, 0.7);
    border: 2px solid #334155;
    border-radius: 15px;
    color: #f8fafc;
    font-size: 1.05rem;
    resize: none;
    min-height: 60px;
    max-height: 150px;
    transition: all 0.3s ease;
    font-family: inherit;
}

.message-input:focus {
    outline: none;
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
}

.char-count {
    font-size: 0.85rem;
    color: #94a3b8;
    text-align: right;
}

.char-count.warning {
    color: #f59e0b;
}

.char-count.error {
    color: #ef4444;
}

.input-actions {
    display: flex;
    gap: 10px;
}

.icon-button {
    width: 50px;
    height: 50px;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-size: 1.2rem;
}

.icon-button:hover {
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
    border-color: rgba(96, 165, 250, 0.3);
}

.send-button {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-size: 1.3rem;
}

.send-button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
}

.send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* ===== NOTIFICATION ===== */
.notification {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    color: white;
    padding: 15px 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    animation: slideInRight 0.3s ease-out;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 350px;
}

.notification-icon {
    font-size: 1.5rem;
}

.notification-content {
    flex: 1;
}

.notification-title {
    font-weight: 600;
    margin-bottom: 4px;
}

.notification-message {
    font-size: 0.9rem;
    opacity: 0.9;
}

/* ===== MODAL ===== */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    animation: fadeIn 0.3s ease-out;
}

.modal {
    background: rgba(30, 41, 59, 0.95);
    border-radius: 20px;
    padding: 40px;
    max-width: 500px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    animation: fadeInUp 0.4s ease-out;
}

.modal-header {
    margin-bottom: 30px;
    text-align: center;
}

.modal-title {
    font-size: 1.8rem;
    color: #f8fafc;
    margin-bottom: 10px;
}

.modal-subtitle {
    color: #94a3b8;
    font-size: 1.05rem;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 15px;
    margin-top: 30px;
}

.modal-button {
    padding: 12px 30px;
    border-radius: 10px;
    border: none;

<body>
    <div id="root"></div>
    
    <script type="module">
        import React, { useState, useEffect, useRef } from 'react';
import { createRoot } from 'react-dom/client';
import { io } from 'socket.io-client';

// Initialize socket connection
const socket = io('http://localhost:3001');

// ==================== MAIN APP COMPONENT ====================
function App() {
  const [page, setPage] = useState('landing');
  const [username, setUsername] = useState('');
  const [userData, setUserData] = useState(null);
  const [currentRoom, setCurrentRoom] = useState('public');
  const [theme, setTheme] = useState('seaside');
  const [soundEnabled, setSoundEnabled] = useState(true);
  const [notificationsEnabled, setNotificationsEnabled] = useState(true);
  const [isFirstVisit, setIsFirstVisit] = useState(true);

  // Load user preferences on mount
  useEffect(() => {
    const savedUsername = localStorage.getItem('niamchat_username');
    const savedTheme = localStorage.getItem('niamchat_theme') || 'seaside';
    const savedSound = localStorage.getItem('niamchat_sound') !== 'false';
    const savedNotifications = localStorage.getItem('niamchat_notifications') !== 'false';
    const visited = localStorage.getItem('niamchat_visited');

    if (savedUsername) {
      setUsername(savedUsername);
      setIsFirstVisit(!visited);
    }

    setTheme(savedTheme);
    setSoundEnabled(savedSound);
    setNotificationsEnabled(savedNotifications);
    document.body.className = `theme-${savedTheme}`;
  }, []);

  // Handle username submission
  const handleUsernameSubmit = (e) => {
    e.preventDefault();
    if (username.trim()) {
      socket.emit('set_username', username.trim());
      socket.once('username_set', (data) => {
        setUserData(data);
        localStorage.setItem('niamchat_username', username.trim());
        localStorage.setItem('niamchat_visited', 'true');
        
        if (isFirstVisit) {
          setPage('main-hub');
        } else {
          setPage('chat');
          joinRoom('public', 'Public Chat');
        }
      });
    }
  };

  // Join a room
  const joinRoom = (roomId, roomName, isPrivate = false) => {
    socket.emit('join_room', { roomId, roomName, isPrivate });
    setCurrentRoom(roomId);
  };

  // Change theme
  const changeTheme = (newTheme) => {
    setTheme(newTheme);
    localStorage.setItem('niamchat_theme', newTheme);
    document.body.className = `theme-${newTheme}`;
  };

  // Toggle sound
  const toggleSound = () => {
    const newValue = !soundEnabled;
    setSoundEnabled(newValue);
    localStorage.setItem('niamchat_sound', newValue.toString());
  };

  // Toggle notifications
  const toggleNotifications = () => {
    const newValue = !notificationsEnabled;
    setNotificationsEnabled(newValue);
    localStorage.setItem('niamchat_notifications', newValue.toString());
  };

  // Render current page
  switch (page) {
    case 'landing':
      return (
        <LandingPage
          username={username}
          setUsername={setUsername}
          onSubmit={handleUsernameSubmit}
          theme={theme}
        />
      );
    case 'main-hub':
      return (
        <MainHub
          onSelectPublic={() => {
            setPage('chat');
            joinRoom('public', 'Public Chat');
          }}
          onSelectPrivate={() => setPage('private-rooms')}
          theme={theme}
          soundEnabled={soundEnabled}
          notificationsEnabled={notificationsEnabled}
          onToggleSound={toggleSound}
          onToggleNotifications={toggleNotifications}
          onChangeTheme={changeTheme}
        />
      );
    case 'private-rooms':
      return (
        <PrivateRooms
          onBack={() => setPage('main-hub')}
          onJoinRoom={joinRoom}
          theme={theme}
        />
      );
    case 'chat':
      return (
        <ChatRoom
          socket={socket}
          userData={userData}
          currentRoom={currentRoom}
          onBack={() => setPage('main-hub')}
          theme={theme}
          soundEnabled={soundEnabled}
          onChangeTheme={changeTheme}
          onToggleSound={toggleSound}
        />
      );
    default:
      return <LandingPage username={username} setUsername={setUsername} onSubmit={handleUsernameSubmit} />;
  }
}

// ==================== LANDING PAGE ====================
function LandingPage({ username, setUsername, onSubmit, theme }) {
  return (
    <div className="landing-container fade-in-up">
      <h1 className="landing-title">NiamChat</h1>
      <p className="landing-subtitle">Enter your username to begin chatting</p>
      <form onSubmit={onSubmit}>
        <input
          type="text"
          className="username-input"
          placeholder="Enter your username..."
          value={username}
          onChange={(e) => setUsername(e.target.value)}
          autoFocus
          maxLength={20}
          required
        />
        <button type="submit" className="enter-button">
          Enter Chat
        </button>
      </form>
      <div className="mt-3 text-center">
        <small style={{ color: '#94a3b8' }}>
          Choose any username. Admin access requires special username.
        </small>
      </div>
    </div>
  );
}

// ==================== MAIN HUB ====================
function MainHub({
  onSelectPublic,
  onSelectPrivate,
  theme,
  soundEnabled,
  notificationsEnabled,
  onToggleSound,
  onToggleNotifications,
  onChangeTheme
}) {
  const [showSettings, setShowSettings] = useState(false);

  return (
    <div className="main-hub fade-in-up">
      <h1 className="hub-title">Welcome to NiamChat</h1>
      <p className="hub-subtitle">Choose where you want to chat</p>
      
      <div className="hub-buttons">
        <button className="hub-button public" onClick={onSelectPublic}>
          <span className="button-icon">🌐</span>
          <span>Public Chat</span>
          <span className="button-description">Chat with everyone online</span>
        </button>
        
        <button className="hub-button private" onClick={onSelectPrivate}>
          <span className="button-icon">🔒</span>
          <span>Private Chats</span>
          <span className="button-description">Create or join private rooms</span>
        </button>
      </div>

      <div className="first-time-settings">
        <h3 style={{ marginBottom: '20px', color: '#f8fafc' }}>First Time Setup</h3>
        
        <div className="setting-option" style={{ marginBottom: '15px' }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer' }}>
            <input
              type="checkbox"
              checked={soundEnabled}
              onChange={onToggleSound}
              style={{ width: '18px', height: '18px' }}
            />
            <span>Enable message sounds</span>
          </label>
        </div>

        <div className="setting-option" style={{ marginBottom: '25px' }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer' }}>
            <input
              type="checkbox"
              checked={notificationsEnabled}
              onChange={onToggleNotifications}
              style={{ width: '18px', height: '18px' }}
            />
            <span>Enable browser notifications</span>
          </label>
        </div>

        <div className="theme-selection">
          <p style={{ marginBottom: '10px', color: '#f8fafc' }}>Choose a theme:</p>
          <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
            {['seaside', 'cozy', 'neon', 'glacier', 'sunset', 'midnight', 'minty', 'cloudline', 'urban', 'crystal'].map((t) => (
              <button
                key={t}
                onClick={() => onChangeTheme(t)}
                style={{
                  width: '40px',
                  height: '40px',
                  borderRadius: '8px',
                  border: theme === t ? '2px solid white' : '1px solid #666',
                  background: getThemeColor(t),
                  cursor: 'pointer'
                }}
                title={t.charAt(0).toUpperCase() + t.slice(1)}
              />
            ))}
          </div>

      {showSettings && (
        <div className="modal-overlay" onClick={() => setShowSettings(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">Settings</h2>
            </div>
            {/* Settings content would go here */}
          </div>
        </div>
      )}
    </div>
  );
}

// Helper function for theme colors
function getThemeColor(theme) {
  const colors = {
    seaside: 'linear-gradient(135deg, #0c4a6e 0%, #0ea5e9 100%)',
    cozy: 'linear-gradient(135deg, #7c2d12 0%, #c2410c 100%)',
    neon: 'linear-gradient(135deg, #1e1b4b 0%, #8b5cf6 100%)',
    glacier: 'linear-gradient(135deg, #164e63 0%, #06b6d4 100%)',
    sunset: 'linear-gradient(135deg, #7c2d12 0%, #dc2626 100%)',
    midnight: 'linear-gradient(135deg, #1e1b4b 0%, #6366f1 100%)',
    minty: 'linear-gradient(135deg, #064e3b 0%, #10b981 100%)',
    cloudline: 'linear-gradient(135deg, #374151 0%, #9ca3af 100%)',
    urban: 'linear-gradient(135deg, #6d28d9 0%, #a78bfa 100%)',
    crystal: 'linear-gradient(135deg, #0d9488 0%, #2dd4bf 100%)'
  };
  return colors[theme] || colors.seaside;
}

// ==================== PRIVATE ROOMS ====================
function PrivateRooms({ onBack, onJoinRoom, theme }) {
  const [roomName, setRoomName] = useState('');
  const [roomCode, setRoomCode] = useState('');
  const [createdRooms, setCreatedRooms] = useState([]);

  const createRoom = () => {
    if (roomName.trim()) {
      const roomId = `private_${Date.now()}`;
      onJoinRoom(roomId, roomName.trim(), true);
      
      // Save to local storage
      const newRoom = {
        id: roomId,
        name: roomName.trim(),
        code: generateRoomCode(),
        createdAt: new Date().toISOString()
      };
      
      const rooms = JSON.parse(localStorage.getItem('niamchat_rooms') || '[]');
      rooms.push(newRoom);
      localStorage.setItem('niamchat_rooms', JSON.stringify(rooms));
      setCreatedRooms(rooms);
      setRoomName('');
    }
  };

  const joinWithCode = () => {
    if (roomCode.trim().length === 6) {
      // In a real app, we'd validate the code with the server
      const roomId = `private_${roomCode.toUpperCase()}`;
      onJoinRoom(roomId, `Private Room ${roomCode}`, true);
    }
  };

  // Generate a 6-character room code
  const generateRoomCode = () => {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let code = '';
    for (let i = 0; i < 6; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return code;
  };

  // Load created rooms from localStorage
  useEffect(() => {
    const rooms = JSON.parse(localStorage.getItem('niamchat_rooms') || '[]');
    setCreatedRooms(rooms);
  }, []);

  return (
    <div className="main-hub fade-in-up">
      <button onClick={onBack} style={{ marginBottom: '30px', padding: '10px 20px' }}>
        ← Back
      </button>
      
      <h1 className="hub-title">Private Chats</h1>
      
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '40px', marginBottom: '50px' }}>
        {/* Create Room */}
        <div style={{ background: 'rgba(30, 41, 59, 0.7)', padding: '30px', borderRadius: '15px' }}>
          <h3 style={{ marginBottom: '20px', color: '#f8fafc' }}>Create New Room</h3>
          <input
            type="text"
            placeholder="Room name"
            value={roomName}
            onChange={(e) => setRoomName(e.target.value)}
            style={{ width: '100%', padding: '15px', marginBottom: '15px', borderRadius: '10px' }}
            maxLength={30}
          />
          <button
            onClick={createRoom}
            style={{ width: '100%', padding: '15px', background: 'linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%)', color: 'white', border: 'none', borderRadius: '10px', cursor: 'pointer' }}
          >
            Create Room
          </button>
        </div>

        {/* Join Room */}
        <div style={{ background: 'rgba(30, 41, 59, 0.7)', padding: '30px', borderRadius: '15px' }}>
          <h3 style={{ marginBottom: '20px', color: '#f8fafc' }}>Join with Code</h3>
          <input
            type="text"
            placeholder="Enter 6-digit code"
            value={roomCode}
            onChange={(e) => setRoomCode(e.target.value.toUpperCase())}
            style={{ width: '100%', padding: '15px', marginBottom: '15px', borderRadius: '10px', textTransform: 'uppercase', letterSpacing: '2px' }}
            maxLength={6}
          />
          <button
            onClick={joinWithCode}
            style={{ width: '100%', padding: '15px', background: 'linear-gradient(135deg, #10b981 0%, #34d399 100%)', color: 'white', border: 'none', borderRadius: '10px', cursor: 'pointer' }}
          >
            Join Room
          </button>
        </div>
      </div>

      {/* Previous Rooms */}
      {createdRooms.length > 0 && (
        <div>
          <h3 style={{ marginBottom: '20px', color: '#f8fafc' }}>Your Rooms</h3>
          <div style={{ display: 'grid', gap: '15px' }}>
            {createdRooms.map((room) => (
              <div key={room.id} style={{ background: 'rgba(30, 41, 59, 0.7)', padding: '20px', borderRadius: '12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontWeight: 'bold', color: '#f8fafc' }}>{room.name}</div>
                  <div style={{ color: '#94a3b8', fontSize: '0.9rem' }}>Code: {room.code}</div>
                </div>
                <button
                  onClick={() => onJoinRoom(room.id, room.name, true)}
                  style={{ padding: '10px 20px', background: 'rgba(59, 130, 246, 0.2)', border: '1px solid rgba(96, 165, 250, 0.3)', color: '#60a5fa', borderRadius: '8px', cursor: 'pointer' }}
                >
                  Join
                </button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ==================== CHAT ROOM ====================
function ChatRoom({ socket, userData, currentRoom, onBack, theme, soundEnabled, onChangeTheme, onToggleSound }) {
  const [messages, setMessages] = useState([]);
  const [onlineUsers, setOnlineUsers] = useState([]);
  const [newMessage, setNewMessage] = useState('');
  const [roomInfo, setRoomInfo] = useState({ name: 'Public Chat', isPrivate: false });
  const [showThemePicker, setShowThemePicker] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [notification, setNotification] = useState(null);
  const messagesEndRef = useRef(null);
  const fileInputRef = useRef(null);

  // Sound effect for new messages
  const playMessageSound = () => {
    if (soundEnabled) {
      try {
        const audio = new Audio('http://localhost:3001/sound/msg.mp3');
        audio.play().catch(() => {
          // Fallback to beep sound
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.frequency.value = 800;
          gainNode.gain.value = 0.1;
          oscillator.start();
          setTimeout(() => oscillator.stop(), 100);
        });
      } catch (error) {
        console.log('Sound playback failed');
      }
    }
  };

  // Show notification
  const showNotification = (title, message) => {
    setNotification({ title, message });
    setTimeout(() => setNotification(null), 3000);
    
    // Browser notification if permitted
    if (Notification.permission === 'granted') {
      new Notification(title, { body: message });
    }
  };

  // Socket event listeners
  useEffect(() => {
    if (!socket) return;

    socket.on('room_joined', ({ room, users, messages: roomMessages }) => {
      setRoomInfo(room);
      setMessages(roomMessages || []);
      setOnlineUsers(users || []);
    });

    socket.on('new_message', (message) => {
      setMessages(prev => [...prev, message]);
      if (message.userId !== socket.id) {
        playMessageSound();
        showNotification('New Message', `${message.username}: ${message.content.substring(0, 30)}...`);
      }
    });

    socket.on('message_updated', (updatedMessage) => {
      setMessages(prev => prev.map(msg => 
        msg.id === updatedMessage.id ? updatedMessage : msg
      ));
    });

    socket.on('user_joined', (user) => {
      setOnlineUsers(prev => [...prev, user]);
      if (user.userId !== socket.id) {
        showNotification('User Joined', `${user.username} joined the room`);
      }
    });

    socket.on('user_left', ({ userId, username }) => {
      setOnlineUsers(prev => prev.filter(user => user.id !== userId));
      if (userId !== socket.id) {
        showNotification('User Left', `${username} left the room`);
      }
    });

    // Request notification permission
    if (Notification.permission === 'default') {
      Notification.requestPermission();
    }

    return () => {
      socket.off('room_joined');
      socket.off('new_message');
      socket.off('message_updated');
      socket.off('user_joined');
      socket.off('user_left');
    };
  }, [socket, soundEnabled]);

  // Auto-scroll to bottom
  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  // Send message
  const sendMessage = (e) => {
    e.preventDefault();
    if (newMessage.trim()) {
      socket.emit('send_message', {
        content: newMessage.trim(),
        imageUrl: null
      });
      setNewMessage('');
    }
  };

  // Handle image upload
  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // Check file size (5MB max)
    if (file.size > 5 * 1024 * 1024) {
      showNotification('Error', 'Image size must be less than 5MB');
      return;
    }

    // Check file type
    if (!file.type.startsWith('image/')) {
      showNotification('Error', 'Please upload an image file');
      return;
    }

    // In a real app, we would upload to a server
    // For now, we'll create a local URL and send it
    const reader = new FileReader();
    reader.onloadend = () => {
      const imageUrl = reader.result;
      socket.emit('send_message', {
        content: '📸 Image',
        imageUrl: imageUrl
      });
    };
    reader.readAsDataURL(file);
  };

  // Like a message
  const likeMessage = (messageId) => {
    socket.emit('like_message', { messageId });
  };

  // Dislike a message
  const dislikeMessage = (messageId) => {
    socket.emit('dislike_message', { messageId });
  };

  // Copy message to clipboard
  const copyMessage = (text) => {
    navigator.clipboard.writeText(text).then(() => {
      showNotification('Copied', 'Message copied to clipboard');
    });
  };

  return (
    <div className="chat-container">
      {/* Sidebar */}
      <div className="sidebar">
        <div className="user-info">
          <div className="user-avatar">
            {userData?.displayName?.charAt(0) || 'U'}
          </div>
          <div className="username-display">{userData?.displayName}</div>
          <div className="user-status">
            <div className="status-dot"></div>
            <span>Online</span>
          </div>
        </div>

        <div className="room-switcher">
          <div className="switcher-title">Chat Rooms</div>
          <button 
            className={`switch-button ${currentRoom === 'public' ? 'active' : ''}`}
            onClick={() => {
              socket.emit('join_room', { roomId: 'public', roomName: 'Public Chat' });
              setCurrentRoom('public');
            }}
          >
            🌐 Public Chat
          </button>
          <button 
            className="switch-button"
            onClick={onBack}
          >
            ← Back to Hub
          </button>
        </div>

        <div className="online-users">
          <div className="online-title">
            <span>Online Users</span>
            <span className="user-count">{onlineUsers.length}</span>
          </div>
          <ul className="user-list">
            {onlineUsers.map(user => (
              <li key={user.id} className="user-item">
                <div className="user-avatar-small">
                  {user.username?.charAt(0) || 'U'}
                </div>
                <div className="user-details">
                  <div className="user-name">
                    {user.username}
                    {user.isAdmin && <span className="sender-badge admin">Admin</span>}
                  </div>
                  <div className="user-status-small">Online</div>
                </div>
              </li>
            ))}
          </ul>
        </div>
      </div>

      {/* Main Chat Area */}
      <div className="chat-main">
        <div className="chat-header">
          <div className="room-info">
            <div className="room-icon">
              {roomInfo.isPrivate ? '🔒' : '🌐'}
            </div>
            <div className="room-details">
              <h2>{roomInfo.name}</h2>
              <div className="room-stats">
                <span>{onlineUsers.length} online</span>
                {roomInfo.code && <span className="room-code">{roomInfo.code}</span>}
              </div>
            </div>
          </div>

          <div className="chat-actions">
            <button className="action-button" onClick={() => setShowThemePicker(!showThemePicker)}>
              🎨 Theme
            </button>
            <button className="action-button" onClick={() => setShowSettings(true)}>
              ⚙️ Settings
            </button>
          </div>
        </div>

        <div className="messages-container">
          {messages.map((message) => (
            <Message
              key={message.id}
              message={message}
              isOwn={message.userId === socket.id}
              onLike={() => likeMessage(message.id)}
              onDislike={() => dislikeMessage(message.id)}
              onCopy={() => copyMessage(message.content)}
            />
          ))}
          <div ref={messagesEndRef} />
        </div>

        <form className="message-input-area" onSubmit={sendMessage}>
          <div className="input-wrapper">
            <textarea
              className="message-input"
              placeholder="Type your message here... (400 characters max)"
              value={newMessage}
              onChange={(e) => setNewMessage(e.target.value)}
              maxLength={400}
              rows="3"
            />
            <div className={`char-count ${newMessage.length > 350 ? 'warning' : ''} ${newMessage.length >= 400 ? 'error' : ''}`}>
              {newMessage.length}/400
            </div>
          </div>

          <div className="input-actions">
            <button
              type="button"
              className="icon-button"
              onClick={() => fileInputRef.current?.click()}
              title="Upload image"
            >
              📷
            </button>
            <input
              type="file"
              ref={fileInputRef}
              accept="image/*"
              onChange={handleImageUpload}
              style={{ display: 'none' }}
            />
            
            <button
              type="button"
              className="icon-button"
              onClick={onToggleSound}
              title={soundEnabled ? "Disable sounds" : "Enable sounds"}
            >
              {soundEnabled ? '🔊' : '🔇'}
            </button>

            <button
              type="submit"
              className="send-button"
              disabled={!newMessage.trim()}
              title="Send message"
            >
              ➤
            </button>
          </div>
        </form>
      </div>

      {/* Theme Picker */}
      {showThemePicker && (
        <div className="theme-picker show">
          {['seaside', 'cozy', 'neon', 'glacier', 'sunset', 'midnight', 'minty', 'cloudline', 'urban', 'crystal'].map((t) => (
            <button
              key={t}
              className={`theme-option ${theme === t ? 'active' : ''}`}
              data-theme={t}
              onClick={() => {
                onChangeTheme(t);
                setShowThemePicker(false);
              }}
              title={t.charAt(0).toUpperCase() + t.slice(1)}
            />
          ))}
        </div>
      )}

      {/* Settings Modal */}
      {showSettings && (
        <div className="modal-overlay" onClick={() => setShowSettings(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2 className="modal-title">Settings</h2>
              <p className="modal-subtitle">Customize your chat experience</p>
            </div>
            
            <div style={{ marginBottom: '20px' }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '15px', cursor: 'pointer' }}>
                <input
                  type="checkbox"
                  checked={soundEnabled}
                  onChange={onToggleSound}
                />
                <span>Enable message sounds</span>
              </label>
            </div>

            <div className="modal-actions">
              <button className="modal-button secondary" onClick={() => setShowSettings(false)}>
                Close
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Notification */}
      {notification && (
        <div className="notification slide-in-right">
          <div className="notification-icon">💬</div>
          <div className="notification-content">
            <div className="notification-title">{notification.title}</div>
            <div className="notification-message">{notification.message}</div>
          </div>
          <button onClick={() => setNotification(null)} style={{ background: 'none', border: 'none', color: 'white', cursor: 'pointer' }}>
            ✕
          </button>
        </div>
      )}
    </div>
  );
}

// ==================== MESSAGE COMPONENT ====================
function Message({ message, isOwn, onLike, onDislike, onCopy }) {
  const [showActions, setShowActions] = useState(false);
  
  const formatTime = (timestamp) => {
    const date = new Date(timestamp);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  };

  return (
    <div
      className={`message ${isOwn ? 'sent' : 'received'} ${message.isAdmin ? 'admin' : ''} ${message.isCreator ? 'creator' : ''}`}
      onMouseEnter={() => setShowActions(true)}
      onMouseLeave={() => setShowActions(false)}
    >
      <div className="message-header">
        <div className="message-sender">
          <div className="sender-avatar">
            {message.username?.charAt(0) || 'U'}
          </div>
          <div className="sender-name">
            {message.username}
            {message.isAdmin && <span className="sender-badge admin">Admin</span>}
            {message.isCreator && <span className="sender-badge creator">Creator</span>}
          </div>
        </div>
        <div className="message-time">{formatTime(message.timestamp)}</div>
      </div>

      <div className="message-content">
        {message.content}
        {message.imageUrl && (
          <img
            src={message.imageUrl}
            alt="Uploaded"
            className="message-image"
            onClick={() => window.open(message.imageUrl, '_blank')}
          />
        )}
      </div>

      <div className="message-actions">
        <button
          className={`action-button-small ${message.likes?.length > 0 ? 'liked' : ''}`}
          onClick={onLike}
          title="Like"
        >
          👍 <span className="action-count">{message.likes?.length || 0}</span>
        </button>
        
        <button
          className={`action-button-small ${message.dislikes?.length > 0 ? 'disliked' : ''}`}
          onClick={onDislike}
          title="Dislike"
        >
          👎 <span className="action-count">{message.dislikes?.length || 0}</span>
        </button>
        
        <button
          className="action-button-small"
          onClick={onCopy}
          title="Copy message"
        >
          📋 Copy
        </button>
      </div>
    </div>
  );
}
